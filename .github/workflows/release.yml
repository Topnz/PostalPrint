# Builds PostalPrint.exe and publishes it as a GitHub Release when a version tag is pushed:
#   git tag v1.0.0
#   git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .[dev]
      - run: python -m pytest
      - run: python scripts/build_exe.py
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PostalPrint.exe
            dist/PostalPrint-windows.zip
          generate_release_notes: true
