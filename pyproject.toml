[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "postalprint"
version = "1.0.0"
description = "Prints Danish address labels for letters on a 100 × 150 mm label printer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tobias Elkjær Flugt" }]
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "reportlab==5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pypdf==6.21.4",
    "pyinstaller==6.22.3",
]

[project.scripts]
postalprint = "postalprint.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"postalprint.addresses" = ["postnumre.json"]
"postalprint.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
